<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anh Xin Lỗi Em ❤️</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      overflow:hidden;

      display:flex;
      justify-content:center;
      align-items:center;

      background:linear-gradient(135deg,#ff9a9e,#fad0c4);

      position:relative;
    }

    .container{
      width:90%;
      max-width:650px;

      background:white;

      padding:40px;

      border-radius:25px;

      text-align:center;

      box-shadow:0 0 30px rgba(0,0,0,0.2);

      z-index:10;

      animation:fadeIn 1.5s ease;
    }

    h1{
      color:#ff3366;
      font-size:45px;
      margin-bottom:20px;
    }

    .text{
      font-size:20px;
      line-height:1.8;
      color:#444;
    }

    .highlight{
      color:#ff3366;
      font-weight:bold;
      font-size:25px;
    }

    button{
      margin-top:30px;

      padding:15px 35px;

      border:none;
      border-radius:50px;

      background:#ff3366;
      color:white;

      font-size:20px;

      cursor:pointer;

      transition:0.3s;
    }

    button:hover{
      transform:scale(1.1);
      background:#ff174f;
    }

    #message{
      margin-top:30px;

      font-size:25px;

      color:red;

      font-weight:bold;
    }

    .heart{
      position:absolute;
      color:red;
      font-size:20px;

      animation:fall linear infinite;
    }

    @keyframes fall{
      0%{
        transform:translateY(-100px);
        opacity:1;
      }

      100%{
        transform:translateY(110vh);
        opacity:0;
      }
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(40px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>Anh Xin Lỗi Em 💔</h1>

    <div class="text">
      Anh biết thời gian vừa rồi anh đã quá vô tâm...
      <br><br>

      Không để ý cảm xúc của em,
      không quan tâm em đủ nhiều như em cần.
      <br><br>

      Nhưng thật lòng...
      chưa bao giờ anh muốn làm em buồn cả.
      <br><br>

      <span class="highlight">
        Anh thương em rất nhiều ❤️
      </span>
    </div>

    <button onclick="showMessage()">
      Tha lỗi cho anh nha 🥺
    </button>

    <div id="message"></div>

  </div>

  <script>

    function showMessage(){

      document.getElementById("message").innerHTML =
      "Anh hứa sẽ quan tâm em nhiều hơn nữa ❤️";

    }

    function createHeart(){

      const heart = document.createElement("div");

      heart.classList.add("heart");

      heart.innerHTML = "❤️";

      heart.style.left = Math.random() * 100 + "vw";

      heart.style.fontSize =
      Math.random() * 20 + 15 + "px";

      heart.style.animationDuration =
      Math.random() * 3 + 2 + "s";

      document.body.appendChild(heart);

      setTimeout(()=>{
        heart.remove();
      },5000);
    }

    setInterval(createHeart,300);

  </script>

</body>
</html>
