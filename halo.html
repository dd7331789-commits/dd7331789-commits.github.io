<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Hạt Giống Trái Tim</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    background:
    radial-gradient(circle at top,#2d1b4e,#090111 70%);
    font-family:Arial, Helvetica, sans-serif;
}

/* SAO */
.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:0.2;
    }
    to{
        opacity:1;
    }
}

/* ĐẤT */
.ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:140px;
    background:linear-gradient(to top,#1b1207,#3b2615);
    border-top-left-radius:40% 20px;
    border-top-right-radius:40% 20px;
}

/* HẠT GIỐNG */
.seed{
    position:absolute;
    width:24px;
    height:24px;
    background:#ff2d55;
    left:50%;
    top:-60px;
    transform:translateX(-50%) rotate(45deg);
    animation:dropSeed 2.5s forwards;
    z-index:10;
}

.seed::before,
.seed::after{
    content:'';
    position:absolute;
    width:24px;
    height:24px;
    background:#ff2d55;
    border-radius:50%;
}

.seed::before{
    top:-12px;
    left:0;
}

.seed::after{
    left:-12px;
    top:0;
}

@keyframes dropSeed{
    0%{
        top:-60px;
        transform:translateX(-50%) rotate(45deg);
    }

    80%{
        top:72%;
    }

    100%{
        top:70%;
        transform:translateX(-50%) rotate(45deg) scale(0.8);
    }
}

/* THÂN CÂY */
.stem{
    position:absolute;
    width:8px;
    height:0;
    background:linear-gradient(to top,#4caf50,#7dff7d);
    left:50%;
    bottom:130px;
    transform:translateX(-50%);
    border-radius:10px;
    animation:growStem 4s forwards;
    animation-delay:2.5s;
}

@keyframes growStem{
    from{
        height:0;
    }

    to{
        height:260px;
    }
}

/* LÁ */
.leaf{
    position:absolute;
    width:40px;
    height:20px;
    background:#6dff7b;
    border-radius:40px 40px 0 40px;
    opacity:0;
}

.leaf.left{
    left:calc(50% - 38px);
    bottom:240px;
    transform:rotate(-40deg);
    animation:showLeaf 1s forwards;
    animation-delay:5s;
}

.leaf.right{
    left:50%;
    bottom:300px;
    transform:rotate(140deg);
    animation:showLeaf 1s forwards;
    animation-delay:5.5s;
}

@keyframes showLeaf{
    to{
        opacity:1;
    }
}

/* HOA TRÁI TIM */
.flower{
    position:absolute;
    width:90px;
    height:90px;
    background:#ff4d88;
    left:50%;
    bottom:360px;
    transform:translateX(-50%) rotate(45deg) scale(0);
    animation:bloom 2s forwards;
    animation-delay:6s;

    box-shadow:
    0 0 20px #ff4d88,
    0 0 50px #ff4d88,
    0 0 80px #ff85aa;
}

.flower::before,
.flower::after{
    content:'';
    position:absolute;
    width:90px;
    height:90px;
    background:#ff4d88;
    border-radius:50%;
}

.flower::before{
    top:-45px;
    left:0;
}

.flower::after{
    left:-45px;
    top:0;
}

@keyframes bloom{
    0%{
        transform:translateX(-50%) rotate(45deg) scale(0);
    }

    70%{
        transform:translateX(-50%) rotate(45deg) scale(1.2);
    }

    100%{
        transform:translateX(-50%) rotate(45deg) scale(1);
    }
}

/* ÁNH SÁNG */
.glow{
    position:absolute;
    width:250px;
    height:250px;
    background:radial-gradient(circle,
    rgba(255,120,170,0.6),
    transparent 70%);
    left:50%;
    bottom:260px;
    transform:translateX(-50%);
    opacity:0;
    animation:glowShow 2s forwards;
    animation-delay:6.5s;
}

@keyframes glowShow{
    to{
        opacity:1;
    }
}

/* TIM BAY */
.flying-heart{
    position:absolute;
    width:24px;
    height:24px;
    background:#ff5c8a;
    bottom:-30px;
    transform:rotate(45deg);
    animation:floatHeart linear forwards;
    opacity:0.9;
}

.flying-heart::before,
.flying-heart::after{
    content:'';
    position:absolute;
    width:24px;
    height:24px;
    background:#ff5c8a;
    border-radius:50%;
}

.flying-heart::before{
    top:-12px;
    left:0;
}

.flying-heart::after{
    left:-12px;
    top:0;
}

@keyframes floatHeart{
    0%{
        transform:
        translateY(0)
        rotate(45deg)
        scale(0.5);

        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:
        translateY(-120vh)
        translateX(100px)
        rotate(45deg)
        scale(1.2);

        opacity:0;
    }
}

/* TEXT */
.message{
    position:absolute;
    width:100%;
    text-align:center;
    top:80px;
    color:white;
    font-size:42px;
    font-weight:bold;
    opacity:0;
    letter-spacing:2px;

    text-shadow:
    0 0 10px pink,
    0 0 20px pink;

    animation:showText 3s forwards;
    animation-delay:8s;
}

@keyframes showText{
    to{
        opacity:1;
        transform:translateY(10px);
    }
}

/* MỜ SƯƠNG */
.fog{
    position:absolute;
    width:100%;
    height:100%;
    background:
    radial-gradient(circle at center,
    transparent 20%,
    rgba(255,255,255,0.03));
    pointer-events:none;
}
</style>
</head>

<body>

<div class="message">
    Gửi Người Anh Thương ❤️
</div>

<div class="glow"></div>

<div class="seed"></div>

<div class="stem"></div>

<div class="leaf left"></div>
<div class="leaf right"></div>

<div class="flower"></div>

<div class="ground"></div>

<div class="fog"></div>

<script>
/* TẠO SAO */
for(let i = 0; i < 120; i++){

    const star = document.createElement("div");
    star.classList.add("star");

    star.style.left = Math.random() * 100 + "vw";
    star.style.top = Math.random() * 100 + "vh";

    star.style.animationDuration =
    1 + Math.random() * 3 + "s";

    document.body.appendChild(star);
}

/* TIM BAY */
function createHeart(){

    const heart = document.createElement("div");

    heart.classList.add("flying-heart");

    heart.style.left =
    Math.random() * 100 + "vw";

    heart.style.animationDuration =
    4 + Math.random() * 4 + "s";

    heart.style.opacity =
    Math.random();

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },8000);
}

/* CHỜ HOA NỞ XONG */
setTimeout(()=>{

    setInterval(createHeart,250);

},7000);
</script>

</body>
</html>
