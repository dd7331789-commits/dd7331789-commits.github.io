<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Người Mình Thương</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
        }

        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 90%;
        }

        /* Hiệu ứng trái tim */
        .heart-box {
            position: relative;
            display: inline-block;
            animation: beat 1.5s infinite;
            cursor: pointer;
        }

        .heart {
            font-size: 80px;
            color: #ff2d55;
            text-shadow: 0 0 20px #ff2d55;
        }

        @keyframes beat {
            0% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        /* Lời nhắn */
        .message-container {
            margin-top: 30px;
            min-height: 100px;
        }

        #text-content {
            color: white;
            font-size: 1.5rem;
            font-weight: 300;
            line-height: 1.6;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .hint {
            color: #555;
            font-size: 0.9rem;
            margin-top: 10px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>

    <div class="content">
        <div class="heart-box" id="heartBtn">
            <div class="heart">❤</div>
        </div>
        <div class="message-container">
            <div id="text-content"></div>
            <div class="hint" id="hintText">Chạm vào trái tim nhé...</div>
        </div>
    </div>

    <script>
        // 1. Hiệu ứng bầu trời sao lấp lánh
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2,
                    speed: Math.random() * 0.5
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "white";
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                star.y -= star.speed;
                if (star.y < 0) star.y = canvas.height;
            });
            requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();
        drawStars();

        // 2. Hiệu ứng chạy chữ
        const messages = [
            "Chào cậu, người tớ thương...",
            "Cảm ơn cậu đã xuất hiện trong cuộc đời tớ.",
            "Tớ không biết nói lời hoa mỹ...",
            "Nhưng với tớ, cậu là điều quý giá nhất.",
            "Dù thế giới ngoài kia có khó khăn ra sao...",
            "Thì ở đây vẫn luôn có tớ chờ cậu.",
            "Yêu cậu rất nhiều! ❤️"
        ];

        let msgIndex = 0;
        let charIndex = 0;
        const textElement = document.getElementById('text-content');
        const heartBtn = document.getElementById('heartBtn');
        const hintText = document.getElementById('hintText');
        let isTyping = false;

        function typeWriter() {
            if (charIndex < messages[msgIndex].length) {
                textElement.innerHTML += messages[msgIndex].charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 100);
            } else {
                isTyping = false;
                if (msgIndex < messages.length - 1) {
                    setTimeout(() => {
                        if(!isTyping) {
                            textElement.innerHTML = "";
                            charIndex = 0;
                            msgIndex++;
                            isTyping = true;
                            typeWriter();
                        }
                    }, 2000);
                }
            }
        }

        heartBtn.addEventListener('click', () => {
            if (isTyping) return;
            hintText.style.display = 'none';
            textElement.innerHTML = "";
            charIndex = 0;
            msgIndex = 0;
            isTyping = true;
            typeWriter();
        });
    </script>
</body>
</html>
